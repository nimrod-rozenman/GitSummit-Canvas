<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>GitSummit</title>
        <link rel="stylesheet" href="styles.css" />
    </head>
    <body>
        <div class="app">
            <header class="topbar">
                <div class="topline">
                    <div class="brand" title="GitSummit">
                        <svg class="logo" viewBox="0 0 20 20" aria-hidden="true">
                            <path d="M12.4 5.6 19 16.6h-7.4z" fill="currentColor" opacity=".42" />
                            <path d="M7 8 14.2 16.6H1.4z" fill="currentColor" />
                        </svg>
                        <span class="wordmark">GitSummit</span>
                    </div>
                    <div class="actions-col">
                        <div class="action-row">
                            <button class="live on" id="liveBtn" title="Recompute automatically when the repo changes">
                                <i></i> Auto
                            </button>
                            <button class="btn" id="refreshBtn"><span class="btn-ico">⟳</span> Refresh</button>
                        </div>
                        <span class="stamp" id="stamp"></span>
                    </div>
                </div>
                <div class="repo-line">
                    <span class="repo-name" id="repoName">—</span>
                    <span class="branch-flow" id="branchFlow"></span>
                </div>
                <div class="chips" id="chips"></div>
            </header>

            <nav class="tabs" id="tabs" role="tablist">
                <button class="tab" role="tab" data-tab="diagram" aria-selected="true">Diagram</button>
                <button class="tab" role="tab" data-tab="changes" aria-selected="false">
                    Changes <span class="count" id="tabCountChanges">0</span>
                </button>
                <button class="tab" role="tab" data-tab="commits" aria-selected="false">
                    Commits <span class="count" id="tabCountCommits">0</span>
                </button>
                <span class="tab-ink" id="tabInk"></span>
                <span class="tabs-spacer"></span>
                <button class="submit-btn idle" id="feedbackBtn" title="Send your review comments to Copilot">
                    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M14.5 1.5 7.2 8.8" />
                        <path d="M14.5 1.5 9.9 14.5 7.2 8.8 1.5 6.1 14.5 1.5Z" />
                    </svg>
                    <span>Submit comments</span>
                </button>
            </nav>

            <div class="filterbar">
                <input
                    class="filter"
                    id="filter"
                    type="text"
                    placeholder="Filter files…  (/)"
                    autocomplete="off"
                    spellcheck="false"
                />
                <div class="schips" id="schips"></div>
                <span class="fcount" id="fcount"></span>
                <span class="tool-spacer"></span>
                <span class="tabtools" id="tabtools"></span>
            </div>

            <main class="panels">
                <!-- ---------------- Changes ---------------- -->
                <section class="panel active" id="panel-changes" role="tabpanel">
                    <div class="scroll" id="changesScroll">
                        <div class="cards" id="cards"></div>
                    </div>
                </section>

                <!-- ---------------- Diagram ---------------- -->
                <section class="panel" id="panel-diagram" role="tabpanel">
                    <div class="dbar">
                        <div class="legend links" id="legend">
                            <span class="lg"><i style="background: var(--st-A)"></i>Added</span>
                            <span class="lg"><i style="background: var(--st-M)"></i>Edited</span>
                            <span class="lg"><i style="background: var(--st-D)"></i>Deleted</span>
                            <span class="lg"><i style="background: var(--st-R)"></i>Renamed</span>
                            <span class="lg lk"><i class="ln"></i>Uses</span>
                            <span class="lg lk"><i class="ln rm"></i>Link removed</span>
                            <span class="lg"><i class="rk"></i>Risk — read this one closely</span>
                        </div>
                        <span class="hint" id="hint"></span>
                    </div>
                    <div class="stage" id="stage">
                        <div class="tip" id="tip"></div>
                    </div>
                </section>

                <!-- ---------------- Commits ---------------- -->
                <section class="panel" id="panel-commits" role="tabpanel">
                    <div class="scroll">
                        <h2 class="section-title">The story of this branch</h2>
                        <div class="tl" id="timeline"></div>
                        <h2 class="section-title">Where the changes are</h2>
                        <div class="dir-grid" id="dirGrid"></div>
                    </div>
                </section>
            </main>
        </div>
        <div class="sheet" id="sheet" hidden></div>

        <script src="app.js"></script>
    </body>
</html>
